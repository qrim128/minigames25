<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minigames</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="web.css">
    <!-- Web shim: must run BEFORE script.js so the bundle sees a NUI-like environment. -->
    <script src="web-lock.js"></script>
    <script src="web-games.js"></script>
    <script src="web.js"></script>
    <script src="web-coop.js"></script>
    <script src="web-presence.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div id="main-wrapper" inert>
      <div id="root"></div>
      <div id="web-menu"></div>
    </div>
    <div id="web-toast" hidden></div>
    <div id="lock-screen">
      <div class="lock-box">
        <div class="lock-title">ACCESS LOCKED</div>
        <div class="lock-sub">Send this device ID to the owner and wait for approval. This page unlocks automatically.</div>
        <div class="idrow"><div id="device-id-display">DEVICE ID: ...</div><button type="button" id="copy-device-id">Copy</button></div>
        <div id="lock-status">Checking approval...</div>
      </div>
    </div>
  </body>
</html>
